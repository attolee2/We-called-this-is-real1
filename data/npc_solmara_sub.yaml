      - id: EVT_RUDGAR_EDGE
        req: {rank: Friendly, item: ING_IronIngot}
        eff: {rel: +3, craftUnlock: "UPG_BladeEdgeI"}
    observer_followup: ["망치질은 노래처럼 박자를 가졌다."]

